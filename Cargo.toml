[package]
name = "fanotify_scanning"
version = "0.1.2"
edition = "2021"

### <EXECUTABLES> ###
[[bin]]
name = "cryptor"
path = "src/bin/cryptor.rs"

[[bin]]
name = "scanner"
path = "src/main.rs"
### </EXECUTABLES> ###

[dependencies]
libc = "0.2.137"
nix = "0.25.0"
bitflags = "1.3"
serde = { version = "1.0",  features = ["derive"]}
serde_json = "1.0"

