[package]
name = "krom"
version = "0.1.3"
edition = "2021"

### <EXECUTABLES> ###
[[bin]]
name = "cryptor"
path = "src/bin/cryptor.rs"

[[bin]]
name = "kromd"
path = "src/main.rs"
### </EXECUTABLES> ###

[dependencies]
libc = "0.2"
nix = "0.25"
bitflags = "1.3"
serde = { version = "1.0",  features = ["derive"]}
serde_json = "1.0"
daemonize-me = "2.0"
syslog = "6.0"
log = "0.4"
exitcode = "1.1"
anyhow = "1.0"

